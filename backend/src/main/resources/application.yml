spring:
  application:
    name: mini-ecommerce-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mini_ecommerce?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:mini_ecommerce}
    password: ${DB_PASSWORD:mini_ecommerce}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health:
    show-details: always
    probes.enabled: true
springdoc.swagger-ui.path: /swagger-ui.html
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:mini-ecommerce-change-this-secret-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
